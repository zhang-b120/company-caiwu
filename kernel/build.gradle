version "4.0.0"

dependencies {
    implementation('me.ahoo.cosid:cosid-spring-boot-starter:2.8.1') {
        exclude group: 'org.glassfish.jaxb', module: 'jaxb-core'
    }

    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:6.19.0'
    implementation 'io.sentry:sentry-logback:6.19.0'

    implementation 'org.flywaydb:flyway-core:10.14.0'
    implementation 'org.flywaydb:flyway-mysql:10.14.0'

    implementation("me.ahoo.cosid:cosid-spring-redis:2.8.1")
    api("com.aliyun:alibabacloud-dysmsapi20170525:2.0.24")
    implementation 'com.googlecode.aviator:aviator:5.3.3'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.0.Final'
    implementation('net.lingala.zip4j:zip4j:2.11.4')
    implementation 'cglib:cglib:3.3.0'
    implementation "com.alibaba:easyexcel:3.3.2"
    api('org.dromara.sms4j:sms4j-spring-boot-starter:3.3.3')
    api("org.springframework.boot:spring-boot-starter-mail")
    implementation 'net.coobird:thumbnailator:0.4.20'
    testImplementation('org.springframework.boot:spring-boot-starter-test')
}

test {
    useJUnitPlatform()
}

jar {
    enabled = true
}

bootJar {
    enabled = false
}

springBoot {
    buildInfo {
        properties {
            additional = [
                    'expTime'  : (project.hasProperty("expTime") && project.getProperty("expTime") != "unspecified") ? project.getProperty("expTime") : "",
                    'allowHost': (project.hasProperty("allowHost") && project.getProperty("allowHost") != "unspecified") ? project.getProperty("allowHost") : ""
            ]
        }
    }
}